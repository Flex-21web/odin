    <h3>Biko</h3>
    <img src="biko.png" alt="Biko Image" width="500" height="300"> 
    <h3>Description</h3>
    <p>A traditional Filipino sticky rice cake made with coconut milk and brown sugar.</p>

    <h3>Ingredients</h3>
    <ul>
        <li>1 cup sticky rice</li>
        <li>1 can (14 oz) coconut milk</li>
        <li>1/2 cup sugar</li>
        <li>1/4 teaspoon salt</li>
        <li>1/2 cup water</li>
    </ul>
    <h3>Instructions</h3>
    <ol>
        <li>Rinse the sticky rice and soak it in water for 30 minutes.</li>
        <li>Drain the rice and add it to a large saucepan with the coconut milk, sugar, and salt.</li>
        <li>Stir continuously over medium heat until the mixture thickens and boils.</li>
        <li>Reduce heat and simmer for 2-3 minutes, stirring constantly.</li>
        <li>Remove from heat and stir in the water.</li>
        <li>Pour into a greased mold or individual serving dishes.</li>
        <li>Refrigerate for at least 2 hours or until set.</li>
    </ol>
