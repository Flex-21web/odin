    <h3>Tomato Soup</h3>
    <img src="tomato_soup.png" alt="Tomato Soup Image" width="500" height="300">
    <h3>Ingredients</h3>
    <ul>
        <li>2 tablespoons olive oil</li>
        <li>1 onion, chopped</li>
        <li>2 cloves garlic, minced</li>
        <li>1 can (28 oz) crushed tomatoes</li>
        <li>1 teaspoon dried basil</li>
        <li>1 teaspoon dried oregano</li>
        <li>Salt and pepper to taste</li>
    </ul>
    <h3>Instructions</h3>
    <ol>
        <li>Heat the olive oil in a large pot over medium heat.</li>
        <li>Add the onion and garlic. Cook until the vegetables are tender.</li>
        <li>Stir in the crushed tomatoes and seasonings.</li>
        <li>Simmer for 20 minutes or until the soup is heated through.</li>
    </ol>

    <h3>Nutrition Information</h3>
    <p>Calories: ~120–180 kcal per serving</p>
    <p>Total Fat: ~4–8g</p>
    <p>Saturated Fat: ~1–2g</p>
    <p>Cholesterol: ~5–15mg</p>
    <p>Sodium: ~150–300mg</p>
    <p>Total Carbohydrates: ~15–20g</p>
    <p>Dietary Fiber: ~2–3g</p>
    <p>Total Sugars: ~5–10g</p>
    <p>Protein: ~6–10g</p>
