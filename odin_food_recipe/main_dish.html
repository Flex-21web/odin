    <h3>Description</h3>
    <p>Adobo is a popular Filipino dish made with meat, usually chicken or pork, marinated in vinegar, soy sauce, garlic, and spices, then simmered until tender. It is known for its rich and savory flavor.</p>

        <li>6 cloves garlic, minced</li>
